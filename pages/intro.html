<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        
        <title>Connecting...</title>
        <link rel="stylesheet" href="../main.css">
        <link rel="stylesheet" href="https://use.typekit.net/pbz8qha.css">
        <link rel="icon" href="../image/favicon.svg" type="image/svg+xml">
    </head>
    <body class="intro">

        <div>

            <div class="intro-item" onclick="intro1()">
                Are you there?
            </div>
            <div class="intro-item item2 hide" onclick="intro2()">
                Can you hear us?
            </div>
            <div class="intro-item item3 hide" onclick="intro3()">
                Can you see us?
            </div>
            <div class="intro-item item4 hide" onclick="intro4()">
                Do you know us?
            </div>
            <div class="intro-item item5 hide" onclick="intro5()">
                ...
            </div>
            <div class="intro-item item6 hide" onclick="intro6()">
                There you are.
            </div>
            <div class="intro-item item7 hide" onclick="intro7()">
                You will need to adjust to this.
            </div>
            <div class="intro-item item8 hide" onclick="intro8()">
                It takes a lot to forget everything you thought you knew.
            </div>
            <div class="intro-item item9 hide" onclick="intro9()">
                But... Please.
            </div>
            <div class="intro-item item10 hide" onclick="intro10()">
                Embrace us, Philomena.
            </div>
            <div class="intro-button hide">
                <a href="story.html">
                    Connect to the RhizoNet
                </a>
            </div>

        </div>

        <div class="skip-button" onclick="skipIntro()">
            Skip
        </div>

        <script>
            function skipIntro() {
                document.querySelector(".item2").classList.remove("hide");
                document.querySelector(".item3").classList.remove("hide");
                document.querySelector(".item4").classList.remove("hide");
                document.querySelector(".item5").classList.remove("hide");
                document.querySelector(".item6").classList.remove("hide");
                document.querySelector(".item7").classList.remove("hide");
                document.querySelector(".item8").classList.remove("hide");
                document.querySelector(".item9").classList.remove("hide");
                document.querySelector(".item10").classList.remove("hide");
                document.querySelector(".intro-button").classList.remove("hide");
                document.querySelector("body").classList.remove("intro");

            }

            function intro1() {
                document.querySelector(".item2").classList.remove("hide");
            }

            function intro2() {
                document.querySelector(".item3").classList.remove("hide");
            }

            function intro3() {
                document.querySelector(".item4").classList.remove("hide");
            }

            function intro4() {
                document.querySelector(".item5").classList.remove("hide");
            }

            function intro5() {
                document.querySelector(".item6").classList.remove("hide");
                document.querySelector("body").classList.remove("intro");
            }

            function intro6() {
                document.querySelector(".item7").classList.remove("hide");
            }

            function intro7() {
                document.querySelector(".item8").classList.remove("hide");
            }

            function intro8() {
                document.querySelector(".item9").classList.remove("hide");
            }

            function intro9() {
                document.querySelector(".item10").classList.remove("hide");
            }

            function intro10() {
                document.querySelector(".intro-button").classList.remove("hide");
                document.querySelector(".menu-button").classList.remove("hide");
            }
        </script>

    </body>
</html>
